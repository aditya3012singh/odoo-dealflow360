<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealFlow360 | Sales Operations Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Kill Netlify injected badge (CSS can't pierce shadow DOM) -->
    <script>
      (function () {
        function removeNetlifyBadge() {
          const selectors = ['netlify-drawer', '[data-netlify-badge]', '#netlify-badge'];
          selectors.forEach(function (sel) {
            document.querySelectorAll(sel).forEach(function (el) { el.remove(); });
          });
        }
        removeNetlifyBadge();
        var observer = new MutationObserver(removeNetlifyBadge);
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
